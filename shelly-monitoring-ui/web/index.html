<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelly monitoring</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101722; color: #e6edf7; }
    body { max-width: 1100px; margin: auto; padding: 36px 20px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin-bottom: 4px; } p, small { color: #9faec2; } code { color: #80cfff; }
    #connection { padding: 10px 16px; border-radius: 24px; background: #233044; }
    #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; margin-top: 28px; }
    article { padding: 24px; background: #1a2535; border: 1px solid #344359; border-radius: 16px; }
    h2 { overflow-wrap: anywhere; font-size: 1.1rem; } .badge { font-weight: 600; color: #65deb0; }
    .stale { color: #ffca70; } dl { display: grid; grid-template-columns: 1fr auto; gap: 14px; }
    dt { color: #9faec2; } dd { margin: 0; font-variant-numeric: tabular-nums; }
    button { border: 0; padding: 11px 18px; border-radius: 8px; cursor: pointer; font: inherit; margin: 8px 8px 0 0; background: #70cbff; color: #102030; }
    button.off { background: #35475e; color: #eef5ff; } button:disabled { opacity: .4; cursor: not-allowed; }
    .notice { min-height: 2.5em; font-size: .9rem; } .error { color: #ff9c9c; }
    #empty { padding: 40px 0; line-height: 1.7; } footer { margin-top: 32px; font-size: .85rem; color: #9faec2; }
  </style>
</head>
<body>
  <header><div><h1>Shelly monitoring</h1><p>Live telemetry · MQTT switch control</p></div><span id="connection" role="status">Connecting…</span></header>
  <div id="empty">Waiting for telemetry on <code>agent/+/status</code>.<br>The coding-test agent must publish readings before devices appear.</div>
  <main id="devices"></main>
  <footer>Commands set the desired state. Only received telemetry confirms the actual switch state.</footer>
  <script>
    const cards = new Map();
    let state = {connected: false, devices: {}, stale_after_seconds: 20};
    let streamConnected = false;
    const number = value => new Intl.NumberFormat(undefined, {maximumFractionDigits: 2}).format(value);
    function createCard(id) {
      const card = document.createElement('article');
      card.innerHTML = '<h2></h2><span class="badge"></span><dl><dt>Switch</dt><dd class="output"></dd><dt>Power</dt><dd class="power"></dd><dt>Total energy</dt><dd class="energy"></dd><dt>Last observation</dt><dd class="time"></dd></dl><button class="on" type="button">Turn on</button><button class="off" type="button">Turn off</button><p class="notice" role="status"></p>';
      card.querySelector('h2').textContent = id;
      card.querySelector('.on').onclick = () => send(id, true, card);
      card.querySelector('.off').onclick = () => send(id, false, card);
      document.querySelector('#devices').append(card);
      cards.set(id, card);
      return card;
    }
    function render() {
      document.querySelector('#connection').textContent = !streamConnected ? 'Dashboard reconnecting…' : state.connected ? 'MQTT connected' : 'MQTT disconnected';
      document.querySelector('#empty').hidden = Object.keys(state.devices).length > 0;
      for (const [id, dev] of Object.entries(state.devices).sort(([a], [b]) => a.localeCompare(b))) {
        const card = cards.get(id) || createCard(id);
        const age = Math.max(0, (Date.now() - Date.parse(dev.observed_at)) / 1000);
        const stale = age > state.stale_after_seconds;
        const badge = card.querySelector('.badge');
        badge.textContent = stale ? 'Stale telemetry' : 'Live telemetry';
        badge.className = 'badge' + (stale ? ' stale' : '');
        card.querySelector('.output').textContent = dev.output ? 'ON' : 'OFF';
        card.querySelector('.power').textContent = number(dev.power_w) + ' W';
        card.querySelector('.energy').textContent = number(dev.energy_wh) + ' Wh';
        const time = card.querySelector('.time');
        time.textContent = Math.floor(age) + 's ago';
        time.title = new Date(dev.observed_at).toLocaleString();
        for (const button of card.querySelectorAll('button')) button.disabled = !streamConnected || !state.connected || card.dataset.busy === 'true';
      }
    }
    async function send(id, on, card) {
      const notice = card.querySelector('.notice');
      card.dataset.busy = 'true';
      notice.className = 'notice';
      notice.textContent = 'Publishing command…';
      render();
      try {
        const response = await fetch('/api/devices/' + encodeURIComponent(id) + '/command', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({on}), signal: AbortSignal.timeout(6000)
        });
        if (!response.ok) throw new Error((await response.text()).trim());
        notice.textContent = 'Command sent: ' + (on ? 'ON' : 'OFF') + '. Check telemetry for confirmation.';
      } catch (err) {
        notice.className = 'notice error';
        notice.textContent = 'Command failed: ' + err.message;
      } finally {
        card.dataset.busy = 'false';
        render();
      }
    }
    const events = new EventSource('/api/events');
    events.onmessage = event => { state = JSON.parse(event.data); streamConnected = true; render(); };
    events.onerror = () => { streamConnected = false; render(); };
    setInterval(render, 1000);
  </script>
</body>
</html>
