services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -i mosquitto-healthcheck -t healthcheck -m ok"]
      interval: 30s
      timeout: 3s
      retries: 5

  simulator:
    build: ./shelly-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SIMULATOR_HTTP_PORT:-8081}:8080"
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      DEVICE_ID: shellyplug-s-SIM01
      TLS_ENABLED: "false"
      AUTH_ENABLED: "false"

  agent:
    build: ./shelly-agent
    stop_grace_period: 10s
    depends_on:
      simulator:
        condition: service_started
      mosquitto:
        condition: service_healthy
    environment:
      SHELLY_URL: http://simulator:8080
      MQTT_BROKER: tcp://mosquitto:1883
      POLL_INTERVAL: 5s
      HTTP_TIMEOUT: 3s

  ui:
    build: ./shelly-monitoring-ui
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8090"
    environment:
      HTTP_ADDR: :8090
      MQTT_BROKER: tcp://mosquitto:1883
      STALE_AFTER: 20s
